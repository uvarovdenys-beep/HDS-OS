  <title
     id="title1">HDS OS</title>
  <!-- HDS OS wordmark, from the operator's design.
       H and S are light outline letterforms; D is SOLID — the closed letter,
       held inside the brackets. The brackets are the cage and carry the accent,
       so the mark says what the product does before a word is read.

       Two classes, not hardcoded fills: one file then serves the dark console,
       a light page and a monochrome print without being edited.
       H and S are text (a hand-drawn S never looks right); only D is a path,
       because an absolutely flat fill is what a font cannot promise. -->
  <style
     id="style1">
    .cage { fill: #37c2c4; }
    .mark { fill: #d6dee4; }
    @media (prefers-color-scheme: light) { .mark { fill: #18222b; } }
  </style>
